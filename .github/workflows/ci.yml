name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make check
        run: make check
      - name: make build-check
        run: make build-check
      # 起動から最初の画面までの時間と本体の RSS（NFR-05）。20 回の中央値と、各回の値をログに出す。
      - name: make footprint-check
        run: make footprint-check
      - name: make dist-check
        run: make dist-check
      # イメージの取得の失敗と、配布物の起動の失敗を、別のステップとして見分ける。
      - name: make dist-smoke-images
        run: make dist-smoke-images
      - name: make dist-smoke
        run: make dist-smoke
